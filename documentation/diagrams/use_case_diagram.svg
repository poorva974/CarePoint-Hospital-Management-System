<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e3a8a; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; }
      .actor-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .actor-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .boundary-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #0284c7; }
      .uc-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .uc-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
      .assoc { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: none; }
      .include-line { stroke: #0284c7; stroke-width: 1.2; stroke-dasharray: 4,4; }
      .include-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #0284c7; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="860" fill="#f8fafc" />

  <!-- Title Banner -->
  <rect x="30" y="20" width="1040" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)" />
  <text x="50" y="46" class="title">CarePoint Hospital Management System - Use Case Diagram</text>
  <text x="50" y="65" class="subtitle">UML Functional Model (Actors: Public Visitor, Hospital Staff, Administrator | System Boundary: CarePoint Web Application)</text>

  <!-- System Boundary Box -->
  <rect x="230" y="95" width="640" height="740" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)" />
  <text x="250" y="125" class="boundary-title">CarePoint Application Boundary</text>

  <!-- ==================== ACTOR: PUBLIC VISITOR (LEFT TOP) ==================== -->
  <g transform="translate(110, 160)">
    <!-- Stick Figure -->
    <circle cx="0" cy="0" r="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <line x1="0" y1="16" x2="0" y2="52" stroke="#0284c7" stroke-width="2" />
    <line x1="-22" y1="28" x2="22" y2="28" stroke="#0284c7" stroke-width="2" />
    <line x1="0" y1="52" x2="-18" y2="90" stroke="#0284c7" stroke-width="2" />
    <line x1="0" y1="52" x2="18" y2="90" stroke="#0284c7" stroke-width="2" />
    <text x="0" y="112" class="actor-label">Public Visitor</text>
    <text x="0" y="126" class="actor-sub">(Unauthenticated)</text>
  </g>

  <!-- ==================== ACTOR: HOSPITAL STAFF (LEFT MIDDLE) ==================== -->
  <g transform="translate(110, 430)">
    <circle cx="0" cy="0" r="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" />
    <line x1="0" y1="16" x2="0" y2="52" stroke="#4f46e5" stroke-width="2" />
    <line x1="-22" y1="28" x2="22" y2="28" stroke="#4f46e5" stroke-width="2" />
    <line x1="0" y1="52" x2="-18" y2="90" stroke="#4f46e5" stroke-width="2" />
    <line x1="0" y1="52" x2="18" y2="90" stroke="#4f46e5" stroke-width="2" />
    <text x="0" y="112" class="actor-label">Hospital Staff</text>
    <text x="0" y="126" class="actor-sub">(Doctor/Reception/Nurse)</text>
  </g>

  <!-- ==================== ACTOR: ADMINISTRATOR (RIGHT MIDDLE) ==================== -->
  <g transform="translate(990, 430)">
    <circle cx="0" cy="0" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <line x1="0" y1="16" x2="0" y2="52" stroke="#d97706" stroke-width="2" />
    <line x1="-22" y1="28" x2="22" y2="28" stroke="#d97706" stroke-width="2" />
    <line x1="0" y1="52" x2="-18" y2="90" stroke="#d97706" stroke-width="2" />
    <line x1="0" y1="52" x2="18" y2="90" stroke="#d97706" stroke-width="2" />
    <text x="0" y="112" class="actor-label">Administrator</text>
    <text x="0" y="126" class="actor-sub">(System / Superuser)</text>
  </g>

  <!-- ==================== USE CASES (OVALS) ==================== -->
  
  <!-- UC 1: View Landing Page -->
  <g id="uc1">
    <ellipse cx="440" cy="165" rx="120" ry="26" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)" />
    <text x="440" y="163" class="uc-text">UC-01: View Landing Page</text>
    <text x="440" y="177" class="uc-sub">Explore features, mission &amp; public info</text>
  </g>

  <!-- UC 2: Authenticate (Login / Logout) -->
  <g id="uc2">
    <ellipse cx="440" cy="245" rx="135" ry="28" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)" />
    <text x="440" y="242" class="uc-text">UC-02: Authenticate Session</text>
    <text x="440" y="257" class="uc-sub">Login (CSRF + scrypt hash) &amp; Logout</text>
  </g>

  <!-- UC 3: Access Dashboard & Analytics -->
  <g id="uc3">
    <ellipse cx="550" cy="325" rx="130" ry="26" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="550" y="323" class="uc-text">UC-03: View Hospital Dashboard</text>
    <text x="550" y="337" class="uc-sub">Aggregates, recent visits &amp; revenue</text>
  </g>

  <!-- UC 4: Manage Patient Records -->
  <g id="uc4">
    <ellipse cx="450" cy="405" rx="130" ry="26" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="450" y="403" class="uc-text">UC-04: Manage Patients (CRUD)</text>
    <text x="450" y="417" class="uc-sub">Register, search, update &amp; history</text>
  </g>

  <!-- UC 5: Manage Doctor Directory -->
  <g id="uc5">
    <ellipse cx="650" cy="485" rx="130" ry="26" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="650" y="483" class="uc-text">UC-05: Doctor Directory &amp; Staff</text>
    <text x="650" y="497" class="uc-sub">View specialties, contact &amp; dept</text>
  </g>

  <!-- UC 6: Schedule & Manage Appointments -->
  <g id="uc6">
    <ellipse cx="450" cy="565" rx="135" ry="28" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="450" y="562" class="uc-text">UC-06: Schedule Appointments</text>
    <text x="450" y="577" class="uc-sub">Book slots, set status, FK validation</text>
  </g>

  <!-- UC 7: Record Medical Notes & Prescriptions -->
  <g id="uc7">
    <ellipse cx="650" cy="645" rx="135" ry="28" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="650" y="642" class="uc-text">UC-07: Manage Medical Records</text>
    <text x="650" y="657" class="uc-sub">Diagnoses, prescriptions &amp; lab reports</text>
  </g>

  <!-- UC 8: Manage Invoices & Billing -->
  <g id="uc8">
    <ellipse cx="450" cy="725" rx="135" ry="28" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="450" y="722" class="uc-text">UC-08: Process Billing &amp; Invoices</text>
    <text x="450" y="737" class="uc-sub">Create bills, track payments &amp; insurance</text>
  </g>

  <!-- UC 9: Admin Account Provisioning -->
  <g id="uc9">
    <ellipse cx="660" cy="795" rx="130" ry="25" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)" />
    <text x="660" y="793" class="uc-text">UC-09: CLI User Provisioning</text>
    <text x="660" y="807" class="uc-sub">create_admin.py &amp; role allocation</text>
  </g>

  <!-- ==================== ASSOCIATIONS (CONNECTIONS) ==================== -->

  <!-- Public Visitor -> UC 1 -->
  <line x1="140" y1="180" x2="320" y2="168" class="assoc" />

  <!-- Public Visitor -> UC 2 -->
  <line x1="140" y1="210" x2="310" y2="238" class="assoc" />

  <!-- Hospital Staff -> UC 2 -->
  <line x1="140" y1="410" x2="330" y2="265" class="assoc" />

  <!-- Hospital Staff -> UC 3 -->
  <line x1="140" y1="420" x2="425" y2="335" class="assoc" />

  <!-- Hospital Staff -> UC 4 -->
  <line x1="140" y1="440" x2="320" y2="408" class="assoc" />

  <!-- Hospital Staff -> UC 5 -->
  <line x1="140" y1="455" x2="520" y2="485" class="assoc" />

  <!-- Hospital Staff -> UC 6 -->
  <line x1="140" y1="475" x2="315" y2="560" class="assoc" />

  <!-- Hospital Staff -> UC 7 -->
  <line x1="140" y1="495" x2="515" y2="640" class="assoc" />

  <!-- Hospital Staff -> UC 8 -->
  <line x1="140" y1="520" x2="320" y2="720" class="assoc" />

  <!-- Administrator -> Generalizes Staff / Has All Staff Privileges + Admin Provisioning -->
  <line x1="960" y1="420" x2="570" y2="255" class="assoc" />
  <line x1="960" y1="435" x2="680" y2="330" class="assoc" />
  <line x1="960" y1="450" x2="580" y2="410" class="assoc" />
  <line x1="960" y1="465" x2="780" y2="485" class="assoc" />
  <line x1="960" y1="480" x2="585" y2="565" class="assoc" />
  <line x1="960" y1="500" x2="785" y2="645" class="assoc" />
  <line x1="960" y1="520" x2="585" y2="725" class="assoc" />
  <line x1="960" y1="550" x2="790" y2="795" class="assoc" stroke="#dc2626" stroke-width="1.8" />

  <!-- <<include>> relationships: Modules include Authenticate Session -->
  <line x1="550" y1="300" x2="490" y2="270" class="include-line" />
  <text x="540" y="280" class="include-text">&lt;&lt;include&gt;&gt;</text>

  <line x1="450" y1="380" x2="445" y2="275" class="include-line" />
  <text x="415" y="325" class="include-text">&lt;&lt;include&gt;&gt;</text>
</svg>

